<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>মেস হিসাব-নিকাশ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-green: #15803d;
      --light-green: #f0fdf4;
      --card-bg: #ffffff;
      --text-main: #14532d;
      --text-sub: #4b5563;
      --border-color: #bbf7d0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Hind Siliguri', sans-serif;
    }

    body {
      background-color: var(--light-green);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 12px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(21, 128, 61, 0.05);
    }

    header h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--primary-green);
    }

    header p {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 4px;
    }

    .status-badge {
      display: inline-block;
      margin-top: 6px;
      padding: 2px 10px;
      background: #dcfce7;
      color: #166534;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    .frame-wrapper {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(21, 128, 61, 0.08);
      height: 520px; /* অতিরিক্ত ফাঁকা অংশ কমাতে হাইট নিয়ন্ত্রিত রাখা হয়েছে */
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    footer {
      text-align: center;
      font-size: 12px;
      color: #6b7280;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>মেস খরচ ও হিসাব খাতা</h1>
      <p>লাইভ ডেটাসহ সবকটি শিটের বিস্তারিত নিচে দেওয়া হলো</p>
      <span class="status-badge">● অটো আপডেট সক্রিয়</span>
    </header>

    <div class="frame-wrapper">
      <iframe 
        src="https://1drv.ms/x/c/5cfc7176d4a0dfdc/IQAfWBCV0xSCRZeb6GbWwlsyARCj_SmIutzujVet5f2DzuI?e=nAKo2g&action=embedview&wdAllowInteractivity=False&wdHideGridlines=True&wdDownloadButton=False"
        scrolling="no">
      </iframe>
    </div>

    <footer>
      নিচের শিট ট্যাবগুলোতে ক্লিক করে অন্যান্য মাসের হিসাব দেখতে পারেন
    </footer>
  </div>

</body>
</html>
