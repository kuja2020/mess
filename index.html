<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>মেস হিসাব-নিকাশ</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind Siliguri', sans-serif; }
    body { background-color: #f0fdf4; color: #14532d; display: flex; flex-direction: column; align-items: center; padding: 20px 12px; min-height: 100vh; }
    .container { width: 100%; max-width: 1100px; display: flex; flex-direction: column; gap: 14px; }
    header { background: #fff; border: 1px solid #bbf7d0; border-radius: 12px; padding: 16px; text-align: center; box-shadow: 0 4px 12px rgba(21,128,61,0.05); }
    header h1 { font-size: 22px; color: #15803d; }
    header p { font-size: 13px; color: #4b5563; margin-top: 4px; }
    .badge { display: inline-block; margin-top: 6px; padding: 2px 10px; background: #dcfce7; color: #166534; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .frame-wrapper { background: #fff; border: 1px solid #bbf7d0; border-radius: 12px; overflow: hidden; height: 78vh; min-height: 520px; box-shadow: 0 6px 16px rgba(21,128,61,0.08); }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>মেস খরচ ও হিসাব খাতা</h1>
      <p>লাইভ ডেটাসহ সবকটি শিটের বিস্তারিত নিচে দেওয়া হলো</p>
      <span class="badge">● অটো আপডেট সক্রিয়</span>
    </header>
    <div class="frame-wrapper">
      <iframe src="https://1drv.ms/x/c/5cfc7176d4a0dfdc/IQAfWBCV0xSCRZeb6GbWwlsyARCj_SmIutzujVet5f2DzuI?e=nAKo2g&action=embedview&wdAllowInteractivity=False" scrolling="no"></iframe>
    </div>
  </div>
</body>
</html>
